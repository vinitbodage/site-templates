name: Ensure AEM preview URL

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ensure-preview-url:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { number, body = '', head } = context.payload.pull_request;
            const preview = `https://${head.ref.replaceAll('/', '-')}--${repo}--${owner}.aem.page/`;
            const hasProjectUrl = body.includes(`${repo}--${owner}.aem.page`)
              || body.includes(`${repo}--${owner}.hlx.page`);
            if (hasProjectUrl) return;

            const block = `URL for testing:\n\n- ${preview}\n`;
            const next = body.trim() ? `${body.trim()}\n\n${block}` : block;
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: number,
              body: next,
            });
